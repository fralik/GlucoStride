<uiView>
  <div id="suuntoplus">
    <div class="sp-t-s p-hc" style="top:9%;">GlucoStride</div>
    <div class="sp-d-l f-num p-hc" style="top:24%;">
      <eval input="Zapp/{zapp_index}/Output/glucose" outputFormat="script x => x &lt; 0 ? '--' : x.toFixed(1)" default="--" />
    </div>
    <div class="sp-t-s p-hc" style="top:47%;">mmol/L</div>
    <div class="sp-t-s f-num p-hc" style="top:59%;">
      <eval input="Zapp/{zapp_index}/Output/trend" outputFormat="script x => x === 32768 ? '-- mmol/L/min' : (Math.abs(x) &lt; 0.005 ? '0.00' : (x &gt; 0 ? '+' : '') + x.toFixed(2)) + ' mmol/L/min'" default="-- mmol/L/min" />
    </div>
    <div class="sp-t-s f-num p-hc" style="top:71%;">
      <eval input="Zapp/{zapp_index}/Output/age" outputFormat="script x => x &lt; 0 ? 'Age unknown' : 'Age ' + Math.floor(x) + 's'" default="Age unknown" />
    </div>
    <div class="sp-t-s p-hc" style="top:83%;">
      <eval input="Zapp/{zapp_index}/Output/status" outputFormat="script x => ['OK', 'UNAVAILABLE', 'WARMUP', 'SENSOR ERROR', 'TIME UNKNOWN', 'STALE', 'NO DATA', 'DISCONNECTED', 'BAD PACKET', 'CLOCK ERROR', 'CLOCK WAIT', 'CLOCK INVALID', 'CLOCK BACK', 'CLOCK STOPPED', 'CLOCK NO REPLY'][x] || 'UNAVAILABLE'" default="NO DATA" />
    </div>
  </div>
</uiView>
